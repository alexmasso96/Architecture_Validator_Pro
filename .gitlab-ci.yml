stages:
  - test
  - coverage
  - validate

# Default docker image to run the jobs
image: python:3.14

test_build:
  stage: test
  before_script:
    - apt-get update -qy
    - apt-get install -y -qq nodejs npm
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt pytest
    - (cd src/frontend && npm ci && npm run build)
  script:
    - pytest Tests/ -q
  artifacts:
    paths:
      - src/frontend/dist/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"

test_coverage:
  stage: coverage
  dependencies:
    - test_build
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt pytest coverage
  script:
    - coverage run -m pytest Tests/
    - coverage report
  coverage: '/TOTAL.*\s+(\d+)\%/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# Compile the VCU firmware for ARM and Renesas RH850 and run the pipeline CLI on
# both. The job's exit code is the validation result; a failed run still uploads
# its report. The RH850 compiler is cached: building it takes minutes.
.cli_rules: &cli_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.cli_artifacts: &cli_artifacts
  artifacts:
    when: always
    paths:
      - Resources/VCU_TestProject/pipeline/results/
    expire_in: 1 week

cli_validation:
  stage: validate
  needs: []
  cache:
    key:
      files:
        - Resources/VCU_TestProject/pipeline/build_rh850_toolchain.sh
    paths:
      - Resources/VCU_TestProject/pipeline/rh850-toolchain/
  before_script:
    - apt-get update -qy
    - apt-get install -y -qq cargo libgmp-dev libmpfr-dev libmpc-dev texinfo bison flex
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt maturin
    - pip install -r Resources/VCU_TestProject/pipeline/requirements.txt
    - maturin build --release --manifest-path src/native/parser_rust/Cargo.toml --out target/wheels --compatibility linux
    - pip install --no-index --find-links target/wheels rust_elf_parser
  script:
    - Resources/VCU_TestProject/pipeline/build_rh850_toolchain.sh
    - python Resources/VCU_TestProject/pipeline/build_firmware.py arm
    - python Resources/VCU_TestProject/pipeline/build_firmware.py rh850
    - python Resources/VCU_TestProject/pipeline/make_workbook.py
    - python src/cli/main.py run --config Resources/VCU_TestProject/pipeline/validation-arm.cfg
    - python src/cli/main.py run --config Resources/VCU_TestProject/pipeline/validation-rh850.cfg
  <<: [*cli_rules, *cli_artifacts]
