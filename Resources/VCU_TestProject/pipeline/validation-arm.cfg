# Full CLI run over the VCU test firmware built for ARM. See README.md.

[project]
name = vcu-arm
release = R5.0

[inputs]
workbook = interfaces.xlsx
main_sheet = Main Functions
symbols = APP=build/arm/vcu.elf
source = ../releases/R5.0/src
objects = build/arm/obj
object_pattern = *.o

[columns]
function_column = Operations
port_column = Port Name

[test]
min_match_score = 90
max_unmatched = 0

[security]
encryption = none

[output]
folder = results
