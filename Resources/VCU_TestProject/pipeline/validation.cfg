# CLI run over the VCU test corpus. Generate the workbook first:
#   python scripts/make_vcu_workbook.py
#   python src/cli/main.py run --config Resources/VCU_TestProject/pipeline/validation.cfg

[project]
name = vcu-validation
release = R5.0

[inputs]
workbook = interfaces.xlsx
symbols = APP=../releases/R5.0/vcu_R5.0.elf
source = ../releases/R5.0/src

[columns]
function_column = Operations
port_column = Port Name

[test]
min_match_score = 90
max_unmatched = 0

[security]
encryption = none

[output]
folder = results
